services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: testbench-dvwa
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - testbench_net
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: testbench-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - testbench_net
    restart: unless-stopped

  vulnbench:
    build:
      context: ./testbench/vulnbench
      dockerfile: Dockerfile
    container_name: testbench-vulnbench
    ports:
      - "127.0.0.1:5050:5050"
    networks:
      - testbench_net
    restart: unless-stopped

networks:
  testbench_net:
    driver: bridge
